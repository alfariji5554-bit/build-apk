name: Flutter Build ${{ github.event.inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'URL GitHub repo Flutter'
        required: true
        default: 'https://github.com/username/repo'
      build_type:
        description: 'apk-release | apk-debug | web'
        required: true
        default: 'apk-release'
      user_id:
        description: 'Telegram user ID'
        required: true
      build_id:
        description: 'Build ID dari bot'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Clone user repo
        run: |
          git clone --depth=1 ${{ github.event.inputs.repo_url }} user_project
          echo "✅ Repo cloned: ${{ github.event.inputs.repo_url }}"

      - name: Setup Java (APK only)
        if: ${{ github.event.inputs.build_type != 'web' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Get dependencies
        working-directory: user_project
        run: flutter pub get

      - name: Analyze (non-fatal)
        working-directory: user_project
        run: flutter analyze --no-fatal-warnings || true

      - name: Build APK Release
        if: ${{ github.event.inputs.build_type == 'apk-release' }}
        working-directory: user_project
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Release
        if: ${{ github.event.inputs.build_type == 'apk-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: APK-Release-${{ github.event.inputs.build_id }}
          path: user_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
          if-no-files-found: error

      - name: Build APK Debug
        if: ${{ github.event.inputs.build_type == 'apk-debug' }}
        working-directory: user_project
        run: flutter build apk --debug

      - name: Upload APK Debug
        if: ${{ github.event.inputs.build_type == 'apk-debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: APK-Debug-${{ github.event.inputs.build_id }}
          path: user_project/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
          if-no-files-found: error

      - name: Build Web
        if: ${{ github.event.inputs.build_type == 'web' }}
        working-directory: user_project
        run: flutter build web --release --web-renderer canvaskit

      - name: Zip web build
        if: ${{ github.event.inputs.build_type == 'web' }}
        working-directory: user_project
        run: |
          cd build/web
          zip -r ../../web-build.zip .

      - name: Upload Web Build
        if: ${{ github.event.inputs.build_type == 'web' }}
        uses: actions/upload-artifact@v4
        with:
          name: Web-Build-${{ github.event.inputs.build_id }}
          path: user_project/web-build.zip
          retention-days: 3
          if-no-files-found: error
