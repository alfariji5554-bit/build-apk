name: Flutter Build
run-name: Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      asset_tag:
        description: 'Tag GitHub Release yang menyimpan ZIP sumber'
        required: true
      asset_name:
        description: 'Nama asset ZIP sumber di release'
        required: true
      build_type:
        description: 'apk-release | apk-debug | web | native-release | native-debug'
        required: true
        default: 'apk-release'
      user_id:
        description: 'Telegram user ID'
        required: true
      build_id:
        description: 'Build ID dari bot'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: "Build ${{ inputs.build_id }}"

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Download source ZIP from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_TAG: ${{ inputs.asset_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_JSON=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GH_REPO}/releases/tags/${ASSET_TAG}")
          ASSET_ID=$(printf '%s' "$RELEASE_JSON" | jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name == $n) | .id' | head -n1)
          test -n "$ASSET_ID" -a "$ASSET_ID" != "null" || { echo "Source asset tidak ditemukan: ${ASSET_NAME}"; exit 1; }
          curl -fL --retry 3 --retry-delay 2 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" "https://api.github.com/repos/${GH_REPO}/releases/assets/${ASSET_ID}" -o source-project.zip
          ls -lh source-project.zip

      - name: Extract project from ZIP
        run: |
          set -euo pipefail
          mkdir -p user_project_raw
          unzip -q source-project.zip -d user_project_raw
          if [[ "${{ inputs.build_type }}" == native-* ]]; then
            ROOT=$(find user_project_raw -name gradlew -type f -maxdepth 7 | head -1 | xargs -r dirname)
            if [ -z "$ROOT" ] || [ ! -d "$ROOT/app" ]; then
              echo "Native Android project tidak valid: wajib ada gradlew dan folder app/"
              exit 1
            fi
            mkdir -p native_project
            cp -r "$ROOT/." native_project/
            chmod +x native_project/gradlew
            echo "Native Android root: $ROOT"
          else
            ROOT=$(find user_project_raw -name pubspec.yaml -maxdepth 7 | head -1 | xargs -r dirname)
            if [ -z "$ROOT" ]; then echo "pubspec.yaml tidak ditemukan"; exit 1; fi
            mkdir -p user_project
            cp -r "$ROOT/." user_project/
            echo "Flutter root: $ROOT"
          fi

      - name: Setup Java (APK only)
        if: ${{ inputs.build_type != 'web' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (stable)
        if: ${{ !startsWith(inputs.build_type, 'native-') }}
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        if: ${{ !startsWith(inputs.build_type, 'native-') }}
        run: flutter --version

      - name: Generate Android/Web platform files when missing
        if: ${{ !startsWith(inputs.build_type, 'native-') }}
        working-directory: user_project
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android,web --project-name=web_to_apk
          fi

      - name: Set generated APK app name
        if: ${{ !startsWith(inputs.build_type, 'native-') }}
        working-directory: user_project
        run: |
          if [ -f web_to_apk_config.json ] && [ -f android/app/src/main/AndroidManifest.xml ]; then
            python3 - <<'PYCODE'
          import json, re
          from xml.sax.saxutils import escape
          cfg = json.load(open('web_to_apk_config.json', encoding='utf-8'))
          path = 'android/app/src/main/AndroidManifest.xml'
          text = open(path, encoding='utf-8').read()
          label = escape(str(cfg.get('appName', 'Web App')), {'"': '&quot;'})
          text = re.sub(r'android:label="[^"]*"', lambda _: 'android:label="' + label + '"', text, count=1)
          open(path, 'w', encoding='utf-8').write(text)
          PYCODE
          fi

      - name: Prepare generated web icon
        if: ${{ !startsWith(inputs.build_type, 'native-') }}
        working-directory: user_project
        run: |
          if [ -f assets/app_icon.jpg ]; then
            if ! command -v convert >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y imagemagick; fi
            convert assets/app_icon.jpg assets/app_icon.png
          fi
          if [ -f assets/app_icon.png ]; then file assets/app_icon.png; fi

      - name: Get dependencies
        if: ${{ !startsWith(inputs.build_type, 'native-') }}
        working-directory: user_project
        run: flutter pub get

      - name: Generate Android launcher icon when configured
        if: ${{ inputs.build_type != 'web' && !startsWith(inputs.build_type, 'native-') }}
        working-directory: user_project
        run: |
          if grep -q '^flutter_launcher_icons:' pubspec.yaml; then dart run flutter_launcher_icons; fi

      - name: Analyze (non-fatal)
        if: ${{ !startsWith(inputs.build_type, 'native-') }}
        working-directory: user_project
        run: flutter analyze --no-fatal-warnings || true

      # ── APK RELEASE ───────────────────────────────────────
      - name: Build APK Release
        if: ${{ inputs.build_type == 'apk-release' }}
        working-directory: user_project
        run: flutter build apk --release --no-tree-shake-icons --verbose

      - name: Upload APK Release
        if: ${{ inputs.build_type == 'apk-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: "APK-Release-${{ inputs.build_id }}"
          path: user_project/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
          if-no-files-found: error

      # ── APK DEBUG ─────────────────────────────────────────
      - name: Build APK Debug
        if: ${{ inputs.build_type == 'apk-debug' }}
        working-directory: user_project
        run: flutter build apk --debug --verbose

      - name: Upload APK Debug
        if: ${{ inputs.build_type == 'apk-debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: "APK-Debug-${{ inputs.build_id }}"
          path: user_project/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
          if-no-files-found: error

      # ── WEB ───────────────────────────────────────────────
      - name: Build Web
        if: ${{ inputs.build_type == 'web' }}
        working-directory: user_project
        run: flutter build web --release --verbose

      - name: Zip web output
        if: ${{ inputs.build_type == 'web' }}
        working-directory: user_project
        run: |
          cd build/web
          zip -r ../../web-build.zip .

      - name: Upload Web Build
        if: ${{ inputs.build_type == 'web' }}
        uses: actions/upload-artifact@v4
        with:
          name: "Web-Build-${{ inputs.build_id }}"
          path: user_project/web-build.zip
          retention-days: 3
          if-no-files-found: error

      # ── NATIVE ANDROID ────────────────────────────────────
      - name: Build Native Release APK
        if: ${{ inputs.build_type == 'native-release' }}
        working-directory: native_project
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload Native Release APK
        if: ${{ inputs.build_type == 'native-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: "Native-Release-${{ inputs.build_id }}"
          path: native_project/app/build/outputs/apk/release/*.apk
          retention-days: 3
          if-no-files-found: error

      - name: Build Native Debug APK
        if: ${{ inputs.build_type == 'native-debug' }}
        working-directory: native_project
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Native Debug APK
        if: ${{ inputs.build_type == 'native-debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: "Native-Debug-${{ inputs.build_id }}"
          path: native_project/app/build/outputs/apk/debug/*.apk
          retention-days: 3
          if-no-files-found: error

      # ── CLEANUP ───────────────────────────────────────────
      - name: Cleanup raw extract
        if: always()
        run: rm -rf user_project_raw || true
