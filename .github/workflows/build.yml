name: Flutter APK Build Runner

on:
  repository_dispatch:
    types: [build_flutter_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Download & Extract Project ZIP
        run: |
          mkdir project_build
          cd project_build
          curl -L -o project.zip "${{ github.event.client_payload.file_url }}"
          unzip project.zip

      - name: Install Dependencies & Build APK
        id: flutter_build
        run: |
          cd project_build
          # Masuk ke folder jika zip berisi root folder
          if [ ! -f "pubspec.yaml" ]; then
            cd $(ls -d */ | head -n 1)
          fi
          flutter pub get
          flutter build apk --release > build_log.txt 2>&1

      - name: Find & Send APK File to Telegram
        if: success()
        run: |
          APK_PATH=$(find project_build -name "*.apk" | head -n 1)
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token }}"
          BUILDER="${{ github.event.client_payload.builder_name }}"
          ZIP_NAME="${{ github.event.client_payload.file_name }}"
          BUILD_TIME="${{ github.event.client_payload.build_time }}"
          CHANNEL_INFO="${{ github.event.client_payload.channel_info }}"

          CAPTION="🎉 *BUILD FLUTTER APK BERHASIL!*
━━━━━━━━━━━━━━━━━━━━━━
📦 *Nama Zip:* \`${ZIP_NAME}\`
👤 *Builder:* ${BUILDER}
📅 *Waktu Build:* \`${BUILD_TIME}\`
👨‍💻 *Developer:* @alfaxone1
📢 *Channel Logs:* ${CHANNEL_INFO}
━━━━━━━━━━━━━━━━━━━━━━
⚡ *Status:* APK Siap Diinstall!"

          # Kirim File APK ke Pengirim
          curl -F chat_id="${CHAT_ID}" \
               -F document=@"${APK_PATH}" \
               -F caption="${CAPTION}" \
               -F parse_mode="Markdown" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"

          # Kirim File APK ke Channel Logs
          curl -F chat_id="${CHANNEL_INFO}" \
               -F document=@"${APK_PATH}" \
               -F caption="${CAPTION}" \
               -F parse_mode="Markdown" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"

      - name: Send Detailed Error Log if Build Fails
        if: failure()
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token }}"
          ZIP_NAME="${{ github.event.client_payload.file_name }}"
          
          # Cari log error dari Flutter
          LOG_FILE=$(find project_build -name "build_log.txt" | head -n 1)
          ERROR_DETAILS="Gagal membaca detail error log."
          
          if [ -f "$LOG_FILE" ]; then
            ERROR_DETAILS=$(tail -n 25 "$LOG_FILE" | sed 's/`/'\''/g')
          fi

          FAIL_MSG="❌ *BUILD FLUTTER APK GAGAL!*
━━━━━━━━━━━━━━━━━━━━━━
📦 *Nama Zip:* \`${ZIP_NAME}\`
⚠️ *Penyebab Error (Log Output):*

\`\`\`
${ERROR_DETAILS}
\`\`\`
━━━━━━━━━━━━━━━━━━━━━━
💡 *Saran:* Periksa kembali file \`pubspec.yaml\` dan sintaksis kodingan Dart kamu."

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${FAIL_MSG}" \
            -d "parse_mode=Markdown"
