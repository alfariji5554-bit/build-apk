name: Flutter APK Build Runner

on:
  repository_dispatch:
    types: [build_flutter_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Download & Extract ZIP Project
        run: |
          mkdir project_build
          cd project_build
          curl -L -o project.zip "${{ github.event.client_payload.file_url }}"
          unzip project.zip

      - name: Build APK & Capture Log
        id: flutter_build
        run: |
          cd project_build
          # Masuk ke subfolder jika zip berisi folder utama
          if [ ! -f "pubspec.yaml" ]; then
            cd $(ls -d */ | head -n 1)
          fi
          flutter pub get
          flutter build apk --release > ../build_log.txt 2>&1

      - name: Handle Success - Send APK & Notification
        if: success()
        run: |
          APK_PATH=$(find project_build -name "*.apk" | head -n 1)
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token }}"
          BUILDER="${{ github.event.client_payload.builder_name }}"
          ZIP_NAME="${{ github.event.client_payload.file_name }}"
          BUILD_TIME="${{ github.event.client_payload.build_time }}"
          CHANNEL="${{ github.event.client_payload.channel_info }}"

          CAPTION="🎉 *BUILD FLUTTER APK BERHASIL!*
━━━━━━━━━━━━━━━━━━━━━━
📦 *File:* \`${ZIP_NAME}\`
👤 *Builder:* ${BUILDER}
📅 *Waktu:* \`${BUILD_TIME}\`
📢 *Channel:* ${CHANNEL}
⚡ *Status:* Kompilasi Sukses!"

          # 1. Kirim File APK ke Chat User
          curl -F chat_id="${CHAT_ID}" \
               -F document=@"${APK_PATH}" \
               -F caption="${CAPTION}" \
               -F parse_mode="Markdown" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"

          # 2. Kirim File APK ke Channel Logs
          curl -F chat_id="${CHANNEL}" \
               -F document=@"${APK_PATH}" \
               -F caption="${CAPTION}" \
               -F parse_mode="Markdown" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"

      - name: Handle Error - Create TXT & Send Error Logs
        if: failure()
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token }}"
          ZIP_NAME="${{ github.event.client_payload.file_name }}"
          BUILDER="${{ github.event.client_payload.builder_name }}"
          CHANNEL="${{ github.event.client_payload.channel_info }}"

          # Buat File TXT Error Log lengkap
          echo "=== BUILD ERROR LOG FOR ${ZIP_NAME} ===" > error_report.txt
          echo "Builder: ${BUILDER}" >> error_report.txt
          echo "Date: $(date)" >> error_report.txt
          echo "=======================================" >> error_report.txt
          echo "" >> error_report.txt
          cat build_log.txt >> error_report.txt

          CAPTION_ERR="❌ *BUILD FLUTTER APK GAGAL!*
━━━━━━━━━━━━━━━━━━━━━━
📦 *File:* \`${ZIP_NAME}\`
👤 *Builder:* ${BUILDER}
⚠️ *Detail Error:* Terlampir pada file \`build_error_log.txt\` di bawah ini. Silakan periksa kodingan Flutter kamu."

          # 1. Kirim File TXT Error ke User
          curl -F chat_id="${CHAT_ID}" \
               -F document=@"error_report.txt;filename=build_error_log.txt" \
               -F caption="${CAPTION_ERR}" \
               -F parse_mode="Markdown" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"

          # 2. Kirim Notifikasi & File TXT Error ke Channel Logs
          curl -F chat_id="${CHANNEL}" \
               -F document=@"error_report.txt;filename=build_error_log.txt" \
               -F caption="${CAPTION_ERR}" \
               -F parse_mode="Markdown" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
