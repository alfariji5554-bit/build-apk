name: Flutter APK Build Runner

on:
  repository_dispatch:
    types: [build_flutter_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      # STEP 3: UPDATE STATUS TELEGRAM (Download & Ekstrak)
      - name: Update Status - Downloading & Extracting
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token }}"
          MSG_ID="${{ github.event.client_payload.msg_id }}"
          ZIP_NAME="${{ github.event.client_payload.file_name }}"
          BUILDER="${{ github.event.client_payload.builder_name }}"

          TEXT="⏳ *LIVE BUILDER FLUTTER*
  ━━━━━━━━━━━━━━━━━━━━━━
  📦 *File:* \`${ZIP_NAME}\`
  👤 *Builder:* ${BUILDER}
  🔄 *Status:* \`[3/5] 📥 Mengunduh & Mengekstrak File ZIP...\`
  _Engine sedang menyiapkan struktur folder project Flutter..._"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
            -d "chat_id=${CHAT_ID}" \
            -d "message_id=${MSG_ID}" \
            -d "text=${TEXT}" \
            -d "parse_mode=Markdown"

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Download & Extract ZIP
        run: |
          mkdir project_build
          cd project_build
          curl -L -o project.zip "${{ github.event.client_payload.file_url }}"
          unzip project.zip

      # STEP 4: UPDATE STATUS TELEGRAM (Compiling Flutter APK)
      - name: Update Status - Compiling APK
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token }}"
          MSG_ID="${{ github.event.client_payload.msg_id }}"
          ZIP_NAME="${{ github.event.client_payload.file_name }}"
          BUILDER="${{ github.event.client_payload.builder_name }}"

          TEXT="⏳ *LIVE BUILDER FLUTTER*
  ━━━━━━━━━━━━━━━━━━━━━━
  📦 *File:* \`${ZIP_NAME}\`
  👤 *Builder:* ${BUILDER}
  🔄 *Status:* \`[4/5] ⚙️ Mengompilasi Project Flutter ke APK...\`
  _Menjalankan flutter pub get & flutter build apk --release (Proses memakan waktu 2-4 menit)..._"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
            -d "chat_id=${CHAT_ID}" \
            -d "message_id=${MSG_ID}" \
            -d "text=${TEXT}" \
            -d "parse_mode=Markdown"

      - name: Build APK & Capture Log
        id: flutter_build
        run: |
          cd project_build
          if [ ! -f "pubspec.yaml" ]; then
            cd $(ls -d */ | head -n 1)
          fi
          flutter pub get
          flutter build apk --release > ../build_log.txt 2>&1

      # STEP 5: IF SUCCESS - UPDATE STATUS & SEND APK
      - name: Handle Success
        if: success()
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token }}"
          MSG_ID="${{ github.event.client_payload.msg_id }}"
          BUILDER="${{ github.event.client_payload.builder_name }}"
          ZIP_NAME="${{ github.event.client_payload.file_name }}"
          BUILD_TIME="${{ github.event.client_payload.build_time }}"
          CHANNEL="${{ github.event.client_payload.channel_info }}"
          APK_PATH=$(find project_build -name "*.apk" | head -n 1)

          TEXT="🎉 *LIVE BUILDER FLUTTER*
  ━━━━━━━━━━━━━━━━━━━━━━
  📦 *File:* \`${ZIP_NAME}\`
  👤 *Builder:* ${BUILDER}
  🔄 *Status:* \`[5/5] 🟢 Kompilasi Berhasil! Mengirim APK...\``

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
            -d "chat_id=${CHAT_ID}" \
            -d "message_id=${MSG_ID}" \
            -d "text=${TEXT}" \
            -d "parse_mode=Markdown"

          CAPTION="🎉 *BUILD FLUTTER APK BERHASIL!*
  ━━━━━━━━━━━━━━━━━━━━━━
  📦 *File:* \`${ZIP_NAME}\`
  👤 *Builder:* ${BUILDER}
  📅 *Waktu:* \`${BUILD_TIME}\`
  📢 *Channel:* ${CHANNEL}
  ⚡ *Status:* APK Siap Diinstall!"

          # Kirim File APK ke User
          curl -F chat_id="${CHAT_ID}" \
               -F document=@"${APK_PATH}" \
               -F caption="${CAPTION}" \
               -F parse_mode="Markdown" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"

          # Kirim File APK ke Channel Logs
          curl -F chat_id="${CHANNEL}" \
               -F document=@"${APK_PATH}" \
               -F caption="${CAPTION}" \
               -F parse_mode="Markdown" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"

      # STEP ERROR: IF FAILED - UPDATE STATUS & SEND TXT LOG
      - name: Handle Error
        if: failure()
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token }}"
          MSG_ID="${{ github.event.client_payload.msg_id }}"
          ZIP_NAME="${{ github.event.client_payload.file_name }}"
          BUILDER="${{ github.event.client_payload.builder_name }}"
          CHANNEL="${{ github.event.client_payload.channel_info }}"

          # Buat File TXT Error
          echo "=== BUILD ERROR LOG FOR ${ZIP_NAME} ===" > error_report.txt
          echo "Builder: ${BUILDER}" >> error_report.txt
          echo "Date: $(date)" >> error_report.txt
          echo "=======================================" >> error_report.txt
          echo "" >> error_report.txt
          cat build_log.txt >> error_report.txt

          TEXT="❌ *LIVE BUILDER FLUTTER*
  ━━━━━━━━━━━━━━━━━━━━━━
  📦 *File:* \`${ZIP_NAME}\`
  👤 *Builder:* ${BUILDER}
  🔄 *Status:* \`[ERROR] 🔴 Kompilasi Gagal! Memunculkan Log Error...\``

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
            -d "chat_id=${CHAT_ID}" \
            -d "message_id=${MSG_ID}" \
            -d "text=${TEXT}" \
            -d "parse_mode=Markdown"

          CAPTION_ERR="❌ *BUILD FLUTTER APK GAGAL!*
  ━━━━━━━━━━━━━━━━━━━━━━
  📦 *File:* \`${ZIP_NAME}\`
  👤 *Builder:* ${BUILDER}
  ⚠️ *Detail Error:* Terlampir pada file \`build_error_log.txt\` di bawah. Silakan periksa kodingan Flutter kamu."

          # Kirim Log TXT ke User
          curl -F chat_id="${CHAT_ID}" \
               -F document=@"error_report.txt;filename=build_error_log.txt" \
               -F caption="${CAPTION_ERR}" \
               -F parse_mode="Markdown" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"

          # Kirim Log TXT ke Channel Logs
          curl -F chat_id="${CHANNEL}" \
               -F document=@"error_report.txt;filename=build_error_log.txt" \
               -F caption="${CAPTION_ERR}" \
               -F parse_mode="Markdown" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
